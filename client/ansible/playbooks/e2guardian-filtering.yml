---
# e2guardian per-UID filter groups + iptables OUTPUT redirect (#90).
#
# Renders one managed e2guardian filter group per supervised user from the
# `e2guardian` extra-vars the dashboard computes (see e2guardianPlanSchema in
# server/src/transport/ansible/e2guardian.ts), and installs the paired iptables
# OUTPUT redirect that sends each user's :80/:443 traffic to that user's
# e2guardian listen port. The filter is inert without the redirect, so the two
# are deployed together (docs/architecture.md → "Enforcement responsibilities").
#
# License boundary: e2guardian is configured ONLY by writing config files under
# its pct.d namespace and signalling a reload. No e2guardian code is touched.
#
# Idempotent: group/port assignment is deterministic (computed server-side in
# linux-UID order) and every iptables rule carries a stable comment, so a
# re-run against unchanged policy is a no-op. Pruning artifacts for users no
# longer in the plan (full drift reconciliation) is the periodic re-apply
# work (#93); this playbook owns applying the desired managed set.
- name: Apply e2guardian per-UID web filtering
  hosts: supervised
  become: true
  gather_facts: false

  vars:
    pct_e2g_dir: /etc/e2guardian
    pct_e2g_managed_dir: /etc/e2guardian/pct.d
    # Marker bracketing the managed block in e2guardian's main config, so the
    # extra listen ports can be reconciled without disturbing hand config.
    pct_e2g_marker: "pct-managed (e2guardian-filtering.yml, #90)"

  tasks:
    - name: Validate the e2guardian plan was supplied
      ansible.builtin.assert:
        that:
          - e2guardian is defined
          - e2guardian.users is defined
          - e2guardian.redirectPorts | default([]) | length > 0
        fail_msg: >-
          The 'e2guardian' extra-vars plan is missing or malformed; the
          dashboard must pass a plan validated by e2guardianPlanSchema.
        quiet: true

    - name: Ensure the managed e2guardian namespace exists
      ansible.builtin.file:
        path: "{{ pct_e2g_managed_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Render each supervised user's banned-site list
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/pct-bannedsites.j2"
        dest: "{{ pct_e2g_managed_dir }}/{{ item.linuxUsername }}.bannedsites"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ e2guardian.users }}"
      loop_control:
        label: "{{ item.linuxUsername }} ({{ item.bannedSites | length }} site(s))"
      notify: Reload e2guardian

    - name: Render each supervised user's filter group config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/pct-filtergroup.conf.j2"
        dest: "{{ pct_e2g_dir }}/e2guardianf{{ item.filterGroup }}.conf"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ e2guardian.users }}"
      loop_control:
        label: "{{ item.linuxUsername }} -> group {{ item.filterGroup }}"
      notify: Reload e2guardian

    - name: Render the managed listen-port block for e2guardian.conf
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/pct-managed-listen.conf.j2"
        dest: "{{ pct_e2g_managed_dir }}/listen-ports.conf"
        owner: root
        group: root
        mode: "0644"
      notify: Reload e2guardian

    - name: Wire the managed listen-port block into e2guardian.conf
      ansible.builtin.blockinfile:
        path: "{{ pct_e2g_dir }}/e2guardian.conf"
        marker: "# {mark} {{ pct_e2g_marker }}"
        block: ".Include<{{ pct_e2g_managed_dir }}/listen-ports.conf>"
        create: false
      notify: Reload e2guardian

    - name: Redirect each supervised user's web traffic to their filter group
      ansible.builtin.iptables:
        table: nat
        chain: OUTPUT
        protocol: tcp
        match: owner
        uid_owner: "{{ item.0.linuxUid }}"
        destination_port: "{{ item.1 }}"
        jump: REDIRECT
        to_ports: "{{ item.0.listenPort }}"
        comment: "pct e2guardian {{ item.0.linuxUsername }} dport {{ item.1 }} (#90)"
        state: present
      loop: "{{ e2guardian.users | product(e2guardian.redirectPorts) | list }}"
      loop_control:
        label: "{{ item.0.linuxUsername }} :{{ item.1 }} -> {{ item.0.listenPort }}"
      notify: Persist iptables rules

  handlers:
    - name: Reload e2guardian
      ansible.builtin.systemd:
        name: e2guardian.service
        state: reloaded

    - name: Persist iptables rules
      ansible.builtin.command:
        cmd: netfilter-persistent save
      changed_when: true
