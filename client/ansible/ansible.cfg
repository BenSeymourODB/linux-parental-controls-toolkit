# Baseline Ansible config for local lint / syntax-check of the client playbooks.
# The dashboard runner builds its own inventory and passes connection settings;
# this file only makes `ansible-playbook --syntax-check` and `ansible-lint`
# reproducible from `client/ansible/`.
[defaults]
roles_path = ./roles
inventory = ./inventory.example.ini
host_key_checking = False
retry_files_enabled = False
