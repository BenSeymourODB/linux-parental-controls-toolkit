[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dashboard"
version = "0.0.0"
description = "Parental-controls dashboard: FastAPI orchestrator for Timekpr-nExT, ActivityWatch, e2guardian, and AdGuard Home."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Ben Seymour" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Operating System :: POSIX :: Linux",
    "Private :: Do Not Upload",
]

# Runtime dependencies are listed as stubs for the phases that will need
# them. They are intentionally unpinned; concrete pins land with the code
# that actually imports them so the lockfile reflects real usage.
dependencies = [
    # Phase 2 — web + API
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "httpx",

    # Phase 3 — persistence + policy
    "sqlalchemy>=2.0",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",

    # Phase 4+ — scheduling, auth, transport
    "apscheduler",
    "asyncssh",
    "pyjwt[crypto]",
    "passlib[bcrypt]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "pre-commit",
    "types-passlib",
]

[project.urls]
Homepage = "https://github.com/BenSeymourODB/linux-parental-controls-toolkit"
Issues = "https://github.com/BenSeymourODB/linux-parental-controls-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]

[tool.hatch.build.targets.sdist]
include = ["src/dashboard", "tests", "pyproject.toml"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dashboard"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
