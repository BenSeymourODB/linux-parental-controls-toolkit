name: CI

on:
  # Run on pushes to the default branch (post-merge CI) and on every pull
  # request (pre-merge CI). Pushes to non-default branches are intentionally
  # NOT triggered here: a branch with an open PR would otherwise run this
  # workflow twice on the same commit — once for the push event and once for
  # the pull_request event — which is the duplicate-concurrent-runs problem.
  # Branches without a PR get CI as soon as a PR is opened.
  push:
    branches: [main]
  pull_request:

# Keep only one in-flight CI run per ref: a rapid re-push to a PR cancels the
# now-superseded run instead of piling up. PR runs key on refs/pull/<n>/merge
# (per-PR) and main runs on refs/heads/main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (TypeScript)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f server/package.json ]; then
            cd server && npm ci
          else
            echo "server/package.json not yet present — skipping install"
          fi

      - name: prettier
        run: |
          if [ -f server/package.json ]; then
            cd server && npm run format:check
          else
            echo "server not yet scaffolded — skipping prettier"
          fi

      - name: eslint
        run: |
          if [ -f server/package.json ]; then
            cd server && npm run lint
          else
            echo "server not yet scaffolded — skipping eslint"
          fi

      - name: tsc --noEmit
        run: |
          if [ -f server/package.json ]; then
            cd server && npm run typecheck
          else
            echo "server not yet scaffolded — skipping typecheck"
          fi

  test:
    name: Unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f server/package.json ]; then
            cd server && npm ci
          else
            echo "server/package.json not yet present — skipping install"
          fi

      - name: vitest (unit, with coverage gate)
        run: |
          if [ -f server/package.json ]; then
            cd server && npm test
          else
            echo "server not yet scaffolded — skipping unit tests"
          fi

  frontend-build:
    name: SvelteKit build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install server deps (for the shared /api type check)
        # `npm run check` (svelte-check) type-checks the frontend's type-only
        # imports of the inferred zod DTOs from server/src (CLAUDE.md →
        # "Validation / DTOs"; #53), resolving the server graph's bare imports
        # (zod, drizzle-orm) from server/node_modules. So the server package
        # must be installed for the *check*. The production build (`npm run
        # build` = `vite build`) erases the type-only imports and needs neither
        # the server source nor its deps — which is why the Docker image's
        # frontend stage builds standalone.
        run: |
          if [ -f server/package.json ]; then
            cd server && npm ci
          fi

      - name: Build + check + test the SvelteKit frontend (/admin + /app)
        run: |
          if [ -f server/frontend/package.json ]; then
            cd server/frontend && npm ci && npm run check && npm test && npm run build
          else
            echo "Frontend not yet scaffolded — skipping"
          fi

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck (client + scripts)
        run: |
          mapfile -t sh_files < <(find client/ scripts/ -name "*.sh" 2>/dev/null)
          if [ "${#sh_files[@]}" -gt 0 ]; then
            shellcheck "${sh_files[@]}"
          else
            echo "No shell scripts yet — skipping ShellCheck"
          fi

  client-tests:
    name: Shell tests (bats)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install bats + sqlite3
        run: sudo apt-get update && sudo apt-get install -y bats sqlite3

      - name: bats (client/tests)
        run: |
          if compgen -G "client/tests/*.bats" > /dev/null 2>&1; then
            bats client/tests/
          else
            echo "No client bats tests yet — skipping"
          fi

      - name: bats (scripts/tests)
        run: |
          if compgen -G "scripts/tests/*.bats" > /dev/null 2>&1; then
            bats scripts/tests/
          else
            echo "No scripts bats tests yet — skipping"
          fi

  client-agent:
    name: Client agent (TypeScript)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/agent/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f client/agent/package.json ]; then
            cd client/agent && npm ci
          else
            echo "client/agent not yet scaffolded — skipping install"
          fi

      - name: prettier + eslint + tsc + vitest (with coverage gate)
        run: |
          if [ -f client/agent/package.json ]; then
            cd client/agent
            npm run format:check
            npm run lint
            npm run typecheck
            npm test
          else
            echo "client/agent not yet scaffolded — skipping checks"
          fi

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: ansible-lint
        run: |
          if [ -d client/ansible ]; then
            ansible-lint client/ansible/
          else
            echo "client/ansible not yet present — skipping ansible-lint"
          fi

  docker-build:
    name: Docker image build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        run: |
          if [ -f server/Dockerfile ]; then
            # Build context is the repo root (-f server/Dockerfile) so the
            # runtime stage can COPY client/ansible/playbooks (#260). --load
            # makes the image available to the daemon for the presence check.
            docker buildx build \
              --load \
              --file server/Dockerfile \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --tag pct-dashboard:ci \
              .
          else
            echo "server/Dockerfile not yet present — skipping Docker build"
          fi

      - name: Verify Phase-6 playbooks shipped in the image (#260)
        run: |
          if docker image inspect pct-dashboard:ci > /dev/null 2>&1; then
            echo "Listing /app/ansible/playbooks inside the image:"
            docker run --rm pct-dashboard:ci sh -c '
              set -e
              ls -1R /app/ansible/playbooks
              test -f /app/ansible/playbooks/activitywatch.yml
              test -f /app/ansible/playbooks/apparmor-profiles.yml
              test -f /app/ansible/playbooks/e2guardian-filtering.yml
            '
            echo "OK: Phase-6 playbooks present at PCT_ANSIBLE_PLAYBOOK_SRC."
          else
            echo "Image not built (Dockerfile absent) — skipping playbook presence check."
          fi

  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The TS hooks (prettier/eslint/tsc) run via npm scripts and need
      # the server dependencies installed.
      - name: Install server dependencies
        run: |
          if [ -f server/package.json ]; then
            cd server && npm ci
          fi

      - uses: pre-commit/action@v3.0.1
