name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Lint (TypeScript)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f server/package.json ]; then
            cd server && npm ci
          else
            echo "server/package.json not yet present — skipping install"
          fi

      - name: prettier
        run: |
          if [ -f server/package.json ]; then
            cd server && npm run format:check
          else
            echo "server not yet scaffolded — skipping prettier"
          fi

      - name: eslint
        run: |
          if [ -f server/package.json ]; then
            cd server && npm run lint
          else
            echo "server not yet scaffolded — skipping eslint"
          fi

      - name: tsc --noEmit
        run: |
          if [ -f server/package.json ]; then
            cd server && npm run typecheck
          else
            echo "server not yet scaffolded — skipping typecheck"
          fi

  test:
    name: Unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f server/package.json ]; then
            cd server && npm ci
          else
            echo "server/package.json not yet present — skipping install"
          fi

      - name: vitest (unit, with coverage gate)
        run: |
          if [ -f server/package.json ]; then
            cd server && npm test
          else
            echo "server not yet scaffolded — skipping unit tests"
          fi

  frontend-build:
    name: SvelteKit build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build SvelteKit frontend (/admin + /app)
        run: |
          if [ -f server/frontend/package.json ]; then
            cd server/frontend && npm ci && npm run build
          else
            echo "Frontend not yet scaffolded — skipping"
          fi

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck (client scripts)
        run: |
          if compgen -G "client/**/*.sh" > /dev/null 2>&1 || compgen -G "client/*.sh" > /dev/null 2>&1; then
            find client/ -name "*.sh" -print0 | xargs -0 shellcheck
          else
            echo "No shell scripts in client/ yet — skipping ShellCheck"
          fi

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: ansible-lint
        run: |
          if [ -d client/ansible ]; then
            ansible-lint client/ansible/
          else
            echo "client/ansible not yet present — skipping ansible-lint"
          fi

  docker-build:
    name: Docker image build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        run: |
          if [ -f server/Dockerfile ]; then
            docker buildx build \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --tag pct-dashboard:ci \
              server/
          else
            echo "server/Dockerfile not yet present — skipping Docker build"
          fi

  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The TS hooks (prettier/eslint/tsc) run via npm scripts and need
      # the server dependencies installed.
      - name: Install server dependencies
        run: |
          if [ -f server/package.json ]; then
            cd server && npm ci
          fi

      - uses: pre-commit/action@v3.0.1
