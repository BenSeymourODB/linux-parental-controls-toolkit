name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # stable: vMAJOR.MINOR.PATCH
      - "v[0-9]+.[0-9]+.[0-9]+-*" # prerelease: vMAJOR.MINOR.PATCH-alpha.N etc.

permissions:
  contents: write   # create GitHub Releases
  packages: write   # push to ghcr.io

jobs:
  release:
    name: Build, publish, and release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Run the unit test suite before publishing anything.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f server/package.json ]; then
            cd server && npm ci
          fi

      - name: Unit tests (gate)
        run: |
          if [ -f server/package.json ]; then
            cd server && npm test
          else
            echo "No tests yet — proceeding (remove this once tests exist)"
          fi

      # Build and push the Docker image to GitHub Container Registry.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/benseymourodb/linux-parental-controls-toolkit
          # latest=auto: `latest` (and the {{major}}.{{minor}} alias) apply only to
          # a stable release. A prerelease tag (vX.Y.Z-alpha.N) publishes the exact
          # {{version}} only, so an alpha never moves `latest`.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # metadata-action emits newline-separated `tags`/`labels`; feed them to
      # build-push-action's multiline inputs (a single `docker buildx --tag`
      # would collapse them into one malformed reference).
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the release version into the image so the dashboard knows its
          # own version at runtime (config.ts → the Clients-page drift badge,
          # #352). metadata-action's `version` output is the tag without the
          # leading `v` (e.g. 0.1.0-alpha.5).
          build-args: |
            PCT_SERVER_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build the self-contained installer bundle so the attached artifact works
      # when downloaded and piped to a shell on a fresh machine (the raw modular
      # client/install-client.sh cannot source its siblings in that form). This
      # mirrors what the image serves at /install-client.sh.
      - name: Build install-client.sh bundle
        run: bash client/build-install-bundle.sh ./install-client.sh

      # Publish a GitHub Release; attach the bundled install-client.sh so the
      # server can serve it from /install-client.sh at the matching tagged version.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Any prerelease tag (vX.Y.Z-<suffix>) is flagged as a GitHub pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            install-client.sh
          generate_release_notes: true
