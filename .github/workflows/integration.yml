name: Integration tests

on:
  pull_request:
    branches: [main]
  schedule:
    # 02:00 UTC nightly
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  activitywatch:
    name: ActivityWatch REST client
    runs-on: ubuntu-22.04
    # ActivityWatch publishes no official Docker image (issue #20), so we
    # download the pinned upstream release bundle, checksum-verify it, and run
    # the headless aw-server-rust binary directly via scripts/start-aw-server.sh.
    # The ~200 MB archive is cached across runs (actions/cache, keyed on
    # version + checksum) so only the first run on a given pin actually
    # downloads; the script's own checksum guard then skips the fetch.
    # The step is still guarded so it skips gracefully until the transport
    # tests exist.
    env:
      AW_VERSION: v0.13.2
      AW_SHA256: 8f62b10babf8a8f108cbdf7267c02fbc1ce2a970fa9535f230b3416b803e3360
      AW_CACHE: ${{ github.workspace }}/.aw-cache
      AW_HOST: 127.0.0.1
      AW_PORT: 5600
    steps:
      - uses: actions/checkout@v4

      - name: Check prerequisites
        id: check
        run: |
          if [ -f server/package.json ] \
             && find server/tests/transport/activitywatch -name '*.int.test.ts' -type f 2>/dev/null | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ActivityWatch integration tests not yet present — skipping job"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: cd server && npm ci

      # Persist the downloaded archive across runs. The key includes the
      # checksum, so a version/pin bump misses the cache and re-downloads;
      # an unchanged pin restores the zip and start-aw-server.sh skips the
      # fetch via its own checksum guard.
      - name: Cache aw-server release archive
        if: steps.check.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.AW_CACHE }}/activitywatch-${{ env.AW_VERSION }}-linux-x86_64.zip
          key: aw-server-${{ runner.os }}-${{ env.AW_VERSION }}-${{ env.AW_SHA256 }}

      - name: Start ActivityWatch server
        if: steps.check.outputs.run == 'true'
        run: scripts/start-aw-server.sh

      - name: Integration tests — ActivityWatch transport
        if: steps.check.outputs.run == 'true'
        run: cd server && npm run test:integration -- tests/transport/activitywatch/
        env:
          AW_SERVER_URL: http://localhost:5600

  adguard:
    name: AdGuard Home REST client
    runs-on: ubuntu-22.04
    # Starts AdGuard Home via docker run (not a service container) so the step
    # can be skipped gracefully when the transport tests don't exist yet.
    steps:
      - uses: actions/checkout@v4

      - name: Check prerequisites
        id: check
        run: |
          if [ -f server/package.json ] \
             && find server/tests/transport/adguard -name '*.int.test.ts' -type f 2>/dev/null | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "AdGuard integration tests not yet present — skipping job"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: cd server && npm ci

      - name: Start AdGuard Home
        if: steps.check.outputs.run == 'true'
        run: |
          docker run -d --name adguardhome \
            -p 3000:3000 \
            adguard/adguardhome:latest
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000 && break
            sleep 3
          done

      - name: Integration tests — AdGuard Home transport
        if: steps.check.outputs.run == 'true'
        run: cd server && npm run test:integration -- tests/transport/adguard/
        env:
          ADGUARD_URL: http://localhost:3000
          ADGUARD_USER: admin
          ADGUARD_PASSWORD: password

  ssh-transport:
    name: SSH + timekpra stub
    runs-on: ubuntu-22.04
    # Uses an OpenSSH container with a stub timekpra binary that records
    # its invocations. Validates the full SSH round-trip without Timekpr-nExT.
    steps:
      - uses: actions/checkout@v4

      - name: Check prerequisites
        id: check
        run: |
          if [ -f server/package.json ] \
             && find server/tests/transport/ssh server/tests/transport/timekpr \
                  -name '*.int.test.ts' -type f 2>/dev/null | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "SSH integration tests not yet present — skipping job"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: cd server && npm ci

      - name: Make stub timekpra executable
        if: steps.check.outputs.run == 'true'
        run: chmod +x server/tests/stubs/timekpra

      - name: Generate a key pair and start the SSH target container
        if: steps.check.outputs.run == 'true'
        run: |
          # Key-based auth only (the transport facade never uses passwords).
          # The container adds the public key to the user's authorized_keys on
          # start (linuxserver/openssh-server's PUBLIC_KEY); the tests read the
          # private key via SSH_TARGET_KEY_FILE.
          ssh-keygen -t ed25519 -N '' -C pct-int-test -f "$RUNNER_TEMP/pct_int_key"
          echo "SSH_TARGET_KEY_FILE=$RUNNER_TEMP/pct_int_key" >> "$GITHUB_ENV"
          # linuxserver/openssh-server runs sshd as an unprivileged user, so it
          # listens on container port 2222 (not 22) — map host 2222 -> 2222.
          docker run -d --name ssh-target \
            -p 2222:2222 \
            -v "${{ github.workspace }}/server/tests/stubs:/usr/local/bin:ro" \
            -e PUID=1000 -e PGID=1000 \
            -e USER_NAME=pctagent \
            -e PUBLIC_KEY="$(cat "$RUNNER_TEMP/pct_int_key.pub")" \
            lscr.io/linuxserver/openssh-server:latest
          # Wait for the s6 init to finish (the user + authorized_keys are set up
          # during it), then for the SSH port to accept connections.
          for i in $(seq 1 60); do
            docker logs ssh-target 2>&1 | grep -qF '[ls.io-init] done.' && break
            sleep 2
          done
          for i in $(seq 1 15); do
            nc -z localhost 2222 && break
            sleep 2
          done
          echo "----- ssh-target container logs -----"
          docker logs ssh-target 2>&1 | tail -n 40

      - name: Integration tests — SSH transport
        if: steps.check.outputs.run == 'true'
        run: cd server && npm run test:integration -- tests/transport/ssh/ tests/transport/timekpr/
        env:
          SSH_TARGET_HOST: localhost
          SSH_TARGET_PORT: 2222
          SSH_TARGET_USER: pctagent
          SSH_TARGET_KEY_FILE: ${{ env.SSH_TARGET_KEY_FILE }}

  migrations:
    name: Drizzle migration round-trip
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f server/package.json ]; then
            cd server && npm ci
          else
            echo "server/package.json not yet present — skipping"
          fi

      - name: Apply migrations to a fresh database
        run: |
          if [ -f server/drizzle.config.ts ]; then
            cd server && npx drizzle-kit migrate
          else
            echo "drizzle.config.ts not yet present — skipping"
          fi
        env:
          DATABASE_URL: file:./ci_migration_test.sqlite

      - name: Check schema/migration drift
        run: |
          if [ -f server/drizzle.config.ts ]; then
            cd server && npx drizzle-kit check
          else
            echo "drizzle.config.ts not yet present — skipping"
          fi
        env:
          DATABASE_URL: file:./ci_migration_test.sqlite

  client-install-dryrun:
    name: Client install script dry-run (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dry-run install script in Ubuntu container
        run: |
          if [ -f client/install-client.sh ]; then
            docker run --rm \
              -v "${{ github.workspace }}/client:/scripts:ro" \
              ubuntu:22.04 bash -c "
                apt-get update -q && apt-get install -y -q curl sudo bash
                PCT_SERVER_URL=http://mock.local PCT_DRY_RUN=1 bash /scripts/install-client.sh
              "
          else
            echo "client/install-client.sh not yet present — skipping"
          fi
