repos:
  # TypeScript formatting / linting / type checking run through the
  # server's own npm scripts so the hook and CI share one source of
  # truth. Requires `cd server && npm ci` once after cloning.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: bash -c 'cd server && npm run --silent format:check'
        files: ^server/
        exclude: ^server/(node_modules|dist|coverage|drizzle|frontend)/
        pass_filenames: false

      - id: eslint
        name: eslint
        language: system
        entry: bash -c 'cd server && npm run --silent lint'
        files: ^server/.*\.(ts|js)$
        exclude: ^server/(node_modules|dist|coverage|frontend)/
        pass_filenames: false

      - id: typecheck
        name: tsc --noEmit
        language: system
        entry: bash -c 'cd server && npm run --silent typecheck'
        files: ^server/.*\.ts$
        exclude: ^server/(node_modules|dist|coverage|frontend)/
        pass_filenames: false

  # Shell script linting
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        files: ^client/.*\.sh$

  # ansible-lint is intentionally kept in ci.yml only (not here), because
  # the pre-commit hook has environment sensitivity with ansible-core versions
  # and there are no playbooks to lint yet (client/ansible/ is a reserved
  # placeholder). Add it back here once real playbooks land (Phase 6).

  # Standard file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Allow the two-space hard line breaks that Markdown uses.
        args: [--markdown-linebreak-ext=md]
        # drizzle-kit owns the generated migration/snapshot/journal output
        # (it emits no trailing newline); excluded here to match how prettier
        # (.prettierignore) and eslint already treat server/drizzle/.
        exclude: ^server/drizzle/
      - id: end-of-file-fixer
        exclude: ^server/drizzle/
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
